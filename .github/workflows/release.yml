name: Release

# Publishes @semantic-dapp/* to npm via OIDC trusted publishing (no tokens).
# Prerequisite: each package must already exist on npm and have a Trusted
# Publisher configured (GitHub Actions -> this repo -> workflow "release.yml").
# See docs/RELEASING.md for the one-time bootstrap.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build · publish (OIDC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # registry-url makes setup-node write the npmjs registry into .npmrc, which
      # pnpm needs to target the per-package OIDC token exchange endpoint. No
      # NPM_TOKEN is set, so there is no static token for pnpm to fall back to —
      # it performs the OIDC exchange from the GitHub Actions id-token.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      # pnpm delegates the registry upload to npm; npm bundled with Node 22 is
      # 10.x, which predates OIDC trusted publishing (needs >= 11.5.1).
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      # No NPM_TOKEN in the environment on purpose: a static _authToken makes
      # pnpm bail out of OIDC. With id-token:write and no token, pnpm performs
      # the per-package OIDC exchange and publishes with provenance.
      - name: Publish to npm (trusted publishing)
        run: pnpm -r publish --provenance --access public --no-git-checks
